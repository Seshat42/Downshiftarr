[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "downshiftarr"
version = "0.7.3"
description = "Plex 4K/HDR/DV transcode guard driven by Tautulli and optional Plex Transcoder shim."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Seshat42" }]
dependencies = [
    "plexapi>=4.17",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.setuptools]
py-modules = ["Downshiftarr"]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
hardening = [
    "hypothesis>=6.152",
    "mutmut>=3.3",
]
native-fuzz = [
    "atheris>=2.3; python_version < '3.12'",
]
lint = [
    "ruff>=0.11",
]
security = [
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7",
]
dev = [
    { include-group = "test" },
    { include-group = "hardening" },
    { include-group = "lint" },
    { include-group = "security" },
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast pure unit tests with no external services",
    "simulated: deterministic fake Plex/Tautulli/client tests",
    "media: generated-media tests that require ffmpeg/ffprobe",
    "loki: opt-in tests that contact the local Loki Plex server",
    "browser: opt-in browser smoke tests against local Plex Web",
    "destructive: opt-in tests allowed to mutate the local Loki Plex test library or terminate test sessions",
    "slow: intentionally slower tests excluded from tight loops unless selected",
    "property: manual property-based hardening tests",
    "fuzz: manual Python-level fuzz/generative hardening tests",
    "native_fuzz: manual Atheris/libFuzzer hardening targets using the Python 3.11 WSL lane",
    "monkey: manual seeded random-event hardening tests against fakes",
    "chaos: manual deterministic fault-injection hardening tests against fakes",
    "mutation: manual mutation-testing setup and configuration checks",
    "boundary: manual boundary value analysis tests",
]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = ["Downshiftarr.py"]
pytest_add_cli_args_test_selection = ["tests"]
