name: Daily Release

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: daily-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.16"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  release:
    name: Publish Daily Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testing/daily_release.py --target-sha "${GITHUB_SHA}" --notes-file release-notes.md

      - name: Set up Python
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        if: steps.release.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install FFmpeg
        if: steps.release.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Gitleaks
        if: steps.release.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run release security gate
        if: steps.release.outputs.should_release == 'true'
        run: python3 scripts/testing/verify_local.py --ci

      - name: Build release artifacts
        if: steps.release.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --sdist --wheel --out-dir dist
          (cd dist && sha256sum *.tar.gz *.whl > SHA256SUMS.txt)
          python3 scripts/testing/verify_release_artifacts.py dist

      - name: Re-check daily tag before publishing
        if: steps.release.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Daily tag ${tag} appeared after verification; skipping publish."
            exit 1
          fi

      - name: Create annotated tag
        if: steps.release.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          target="${{ steps.release.outputs.target_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${target}" -m "Daily release ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Attest release artifacts
        if: steps.release.outputs.should_release == 'true'
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: "dist/*"

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md \
            --title "Downshiftarr ${{ steps.release.outputs.tag }}" \
            --verify-tag \
            --latest=false

      - name: Report skipped release
        if: steps.release.outputs.should_release != 'true'
        run: |
          echo "Daily release skipped: ${{ steps.release.outputs.reason }}"
