title = "Downshiftarr secret scanning"

[allowlist]
description = "Allow documented placeholder credentials."
regexes = [
    '''PUT_YOUR_[A-Z_]+_HERE''',
    '''YOUR_[A-Z_]+(_HERE)?''',
]

[[rules]]
id = "plex-token-assignment"
description = "Potential Plex token assigned in source, config, or logs."
regex = '''(?i)(plex(_user)?_token|x-plex-token)\s*[=:]\s*["']?([A-Za-z0-9_-]{12,})'''
secretGroup = 3
keywords = ["plex_token", "x-plex-token"]

[[rules]]
id = "tautulli-api-key-assignment"
description = "Potential Tautulli API key assigned in source, config, or logs."
regex = '''(?i)(tautulli_apikey|api_key|apikey)\s*[=:]\s*["']?([A-Za-z0-9_-]{12,})'''
secretGroup = 2
keywords = ["tautulli", "apikey"]
