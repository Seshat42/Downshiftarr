[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "downshiftarr"
version = "0.7.2"
description = "Plex 4K/HDR/DV transcode guard driven by Tautulli and optional Plex Transcoder shim."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Seshat42" }]
dependencies = [
    "plexapi>=4.17",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.setuptools]
py-modules = ["Downshiftarr"]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
lint = [
    "ruff>=0.11",
]
security = [
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "security" },
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
